<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mapa Leaflet</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        .header {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 6px;
            box-shadow: 0 0 5px rgba(0,0,0,.3);
        }


	.leaflet-tooltip.zajezdnia-label {
	    background: transparent;
	    border: none;
	    box-shadow: none;
	    color: #000;
	    font-weight: bold;
	    font-size: 14px;
	    padding: 0;
	    text-shadow:
	        -1px -1px 0 #fff,
	         1px -1px 0 #fff,
	        -1px  1px 0 #fff,
	         1px  1px 0 #fff;
	}

	.leaflet-tooltip.zajezdnia-label::before {
	    display: none;
	}

	.leaflet-popup-content-wrapper {
	    background: transparent;
	    box-shadow: none;
	}

	.leaflet-popup-tip {
	    display: none;
	}

	.leaflet-popup-content {
	    font-size: 16px;
	    margin: 0;
	    font-weight: bold;
	    text-align: center;
	    text-shadow:
	        -1px -1px 0 #fff,
	         1px -1px 0 #fff,
	        -1px  1px 0 #fff,
	         1px  1px 0 #fff;
	}
	
     </style>
</head>
<body>

<div class="header">
    MZA Zajezdnie
</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
></script>

<script src="Data/Woronicza.js"></script>
<script src="Data/Ostrobramska.js"></script>
<script src="Data/Kleszczowa.js"></script>
<script src="Data/Stalowa.js"></script>
<script src="Data/Plochocinska.js"></script>

<script>
const zajezdnie = {
    "R-1 Woronicza": {
        data: Woronicza,
        color: "#00A97B",
        coords: [52.1872145, 20.9940186],
        icon: L.icon({
            iconUrl: "Icons/Woronicza.png",
            iconSize: [32, 40],
            iconAnchor: [16, 32],
            popupAnchor: [0, -32]
        })
    },

    "R-2 Ostrobramska": {
        data: Ostrobramska,
        color: "#0066FF",
        coords: [52.2331813, 21.1142464],
        icon: L.icon({
            iconUrl: "Icons/Ostrobramska.png",
            iconSize: [32, 40],
            iconAnchor: [16, 32],
            popupAnchor: [0, -32]
        })
    },

    "R-3 Kleszczowa": {
        data: Kleszczowa,
        color: "#6A1B9A",
        coords: [52.1965, 20.9223051],
        icon: L.icon({
            iconUrl: "Icons/Kleszczowa.png",
            iconSize: [32, 40],
            iconAnchor: [16, 32],
            popupAnchor: [0, -32]
        })
    },

    "R-4 Stalowa": {
        data: Stalowa,
        color: "#FF0000",
        coords: [52.2637017, 21.0451748],
        icon: L.icon({
            iconUrl: "Icons/Stalowa.png",
            iconSize: [32, 40],
            iconAnchor: [16, 32],
            popupAnchor: [0, -32]
        })
    },

    "R-6 Płochocińska": {
        data: Plochocinska,
        color: "#566268",
        coords: [52.3183384, 21.0127333],
        icon: L.icon({
            iconUrl: "Icons/Plochocinska.png",
            iconSize: [32, 40],
            iconAnchor: [16, 32],
            popupAnchor: [0, -32]
        })
    }
};


layers = {};
shownLayer = "";

// Wyświetlanie poszczególnych zajezdni
function switchLayers(oddzial) {
    if (shownLayer == oddzial) {
	Object.keys(zajezdnie).forEach(name => {
	    if (name != oddzial) {
		showLayer(name);
    	    }
	});
	shownLayer = "";
	return;
    }
    Object.keys(zajezdnie).forEach(name => {
	if (name == oddzial) {
	    showLayer(name);
    	    shownLayer = oddzial;
	} else {
	    hideLayer(name);
	}
    })
}



function showLayer(name) {
    zajezdnie[name].layer.setStyle({
	opacity: 0.1,
    });
}

function hideLayer(name) {
    zajezdnie[name].layer.setStyle({
	opacity: 0,
    });
}


const bounds = [
    [52.0, 20.60],
    [52.44, 21.40]
];

const map = L.map('map', {
    maxBounds: bounds,
    maxBoundsViscosity: 1.0,
    renderer: L.canvas()
}).setView([52.2447, 21.0322], 12.4);


// Podkład bez etykiet
L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png?key=cb1_4qqs_1_79074f82560803ade70ccb5f',
    {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributor &copy; <a href="https://carto.com/attribution/">CARTO</a'
    }
).addTo(map);

// Etykiety
map.createPane('labels');
map.getPane('labels').style.zIndex = 650;
map.getPane('labels').style.pointerEvents = 'none';

L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png?key=cb1_4qqs_1_79074f82560803ade70ccb5f', 
    {
        pane: 'labels'
    }
).addTo(map);





// Warstwy tras Zajezdni
Object.entries(zajezdnie).forEach(([nazwa, zajezdnia]) => {
    const marker = L.marker(zajezdnia.coords, {
        icon: zajezdnia.icon
    }).addTo(map);

    // Stały numer pod markerem
    marker.bindTooltip(nazwa.split(" ")[0], {
        permanent: true,
        direction: "bottom",
        offset: [0, 0],
        className: "zajezdnia-label"
    });

    // Nazwa po najechaniu
    marker.on("mouseover", function() {
        this.bindPopup(nazwa.split(" ")[1], {
	    closeButton: false,
            autoClose: false,
            closeOnClick: false,
            direction: "top",
            offset: [0, 22],
            className: "zajezdnia-label"
        }).openPopup();
    });

    marker.on("mouseout", function() {
        this.closePopup();
    });

    marker.on("click", () => switchLayers(nazwa));


    zajezdnia.layer = L.geoJSON(zajezdnia.data, {
        style: {
            color: zajezdnia.color,
            weight: 3,
            opacity: 0.1
        }
    }).addTo(map);
});

</script>

</body>

</html>
